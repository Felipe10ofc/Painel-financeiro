
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel Financeiro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

    body {
    font-family: Arial, sans-serif;
    background: #080d18;
    color: #f8fafc;
    padding: 28px 18px;
    max-width: 650px;
    margin: 0 auto;
    line-height: 1.5;
}

}


        header {
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.8px;
    margin-bottom: 8px;
    color: #f8fafc;
        }
        header h1::before {
    content: "";
    display: inline-block;
    width: 5px;
    height: 25px;
    background: #22c55e;
    border-radius: 5px;
    margin-right: 10px;
    vertical-align: -3px;
}

        header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .saldo {
            background: linear-gradient(135deg, #16a34a, #15803d);
            padding: 24px;
            border-radius: 18px;
            margin-bottom: 20px;
        }

        .saldo p {
            font-size: 14px;
            margin-bottom: 12px;
        }

        .saldo h2 {
            font-size: 32px;
        }

        .resumo {
            display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 24px;
        }

        .cartao {
            background: linear-gradient(145deg, #1b2639, #111a2b);
    padding: 22px 16px;
    border: 1px solid #29364b;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .cartao p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .cartao h3 {
            font-size: 19px;
        }

        .entrada {
            color: #4ade80;
        }

        .saida {
            color: #f87171;
        }

        .historico {
            background: #111a2b;
    padding: 22px;
    border: 1px solid #263247;
    border-radius: 18px;
    margin-bottom: 20px;
        }

        .historico h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .historico p {
            color: #94a3b8;
            font-size: 14px;
        }
        
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 8px;
        }

        input, select {
            width: 100%;
    padding: 14px;
    border: 1px solid #334155;
    border-radius: 12px;
    background: #0b1322;
    color: #f8fafc;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
        }
        
input:focus, select:focus {
    border-color: #22c55e;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
}


        button {
            margin-top: 12px;
    padding: 15px;
    border: 1px solid #4ade80;
    border-radius: 12px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #052e16;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
        }
        button:hover {
    opacity: 0.9;
}

button:active {
    transform: scale(0.98);
}

@media (max-width: 360px) {
    body {
        padding: 18px 12px;
    }

    header h1 {
        font-size: 23px;
    }

    .cartao {
        padding: 16px 10px;
    }

    .cartao h3 {
        font-size: 16px;
        overflow-wrap: anywhere;
    }

    .saldo h2 {
        font-size: 27px;
    }

    .historico {
        padding: 16px;
    }
}

    </style>
</head>

<body>

    <header>
        <h1>Meu Painel Financeiro</h1>
        <p>Organize seu dinheiro com facilidade.</p>
    </header>

    <section class="saldo">
        <p>Saldo total</p>
        <h2 id="saldo">R$ 0,00</h2>
    </section>

    <section class="resumo">
        <div class="cartao">
            <p>Entradas</p>
           <h3 class="entrada" id="total-entradas">R$ 0,00</h3>
        </div>

        <div class="cartao">
            <p>Saídas</p>
            <h3 class="saida" id="total-saidas">R$ 0,00</h3>
        </div>
    </section>

    <section class="historico">
        <h2>Histórico de movimentações</h2>
       <div id="lista-movimentacoes">
    <p>Nenhuma movimentação registrada.</p>
</div>
    </section>

</body>

    <section class="historico">
        <h2>Nova movimentação</h2>

        <form id="form-movimentacao">
            <label for="descricao">Descrição</label>
            <input
                type="text"
                id="descricao"
                placeholder="Ex.: Salário"
                required
            >

            <label for="valor">Valor (R$)</label>
            <input
                type="number"
                id="valor"
                placeholder="Ex.: 100"
                min="0.01"
                step="0.01"
                required
            >

            <label for="tipo">Tipo de movimentação</label>
            <select id="tipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
            </select>

            <button type="submit">Adicionar movimentação</button>
        </form>
    </section>

<script>
const formulario = document.getElementById("form-movimentacao");
const descricao = document.getElementById("descricao");
const valor = document.getElementById("valor");
const tipo = document.getElementById("tipo");

const saldoElemento = document.getElementById("saldo");
const entradasElemento = document.getElementById("total-entradas");
const saidasElemento = document.getElementById("total-saidas");
const lista = document.getElementById("lista-movimentacoes");

let movimentacoes = JSON.parse(
    localStorage.getItem("movimentacoes")
) || [];
function formatarDinheiro(valor) {
    return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function atualizarPainel() {
  localStorage.setItem(
    "movimentacoes",
    JSON.stringify(movimentacoes)
);
    let entradas = 0;
    let saidas = 0;

    movimentacoes.forEach(function(item) {
        if (item.tipo === "entrada") {
            entradas += item.valor;
        } else {
            saidas += item.valor;
        }
    });

    saldoElemento.textContent = formatarDinheiro(entradas - saidas);
    entradasElemento.textContent = formatarDinheiro(entradas);
    saidasElemento.textContent = formatarDinheiro(saidas);

    lista.innerHTML = "";

    if (movimentacoes.length === 0) {
        lista.textContent = "Nenhuma movimentação registrada.";
        return;
    }

    
    movimentacoes.forEach(function(item, indice) {
        const linha = document.createElement("div");

linha.style.border = "1px solid #29364b";
        
linha.style.background = "#172235";
linha.style.padding = "12px";
linha.style.borderRadius = "12px";


        linha.style.display = "flex";
        linha.style.justifyContent = "space-between";
        linha.style.alignItems = "center";
        linha.style.gap = "10px";
        linha.style.marginTop = "12px";

        const texto = document.createElement("p");
        const sinal = item.tipo === "entrada" ? "+" : "-";
        const cor = item.tipo === "entrada" ? "#4ade80" : "#f87171";

        texto.textContent =
            item.descricao + " — " + sinal + formatarDinheiro(item.valor);

        texto.style.color = cor;
        texto.style.overflowWrap = "anywhere";

        const botaoExcluir = document.createElement("button");
        botaoExcluir.textContent = "Excluir";
        botaoExcluir.style.marginTop = "0";
        botaoExcluir.style.padding = "8px";
        botaoExcluir.style.fontSize = "12px";
        botaoExcluir.style.background = "#7f1d1d";
        botaoExcluir.style.color = "#ffffff";
        botaoExcluir.style.flexShrink = "0";

        botaoExcluir.addEventListener("click", function() {
            movimentacoes.splice(indice, 1);
            atualizarPainel();
        });

        linha.appendChild(texto);
        linha.appendChild(botaoExcluir);
        lista.appendChild(linha);
    });
}

formulario.addEventListener("submit", function(evento) {
    evento.preventDefault();

    const nome = descricao.value.trim();
    const quantia = Number(valor.value);

    if (nome === "" || !Number.isFinite(quantia) || quantia <= 0) {
        alert("Digite uma descrição e um valor válido.");
        return;
    }

    movimentacoes.push({
        descricao: nome,
        valor: quantia,
        tipo: tipo.value
    });

    formulario.reset();
    atualizarPainel();
});

atualizarPainel();
</script>
</body>
</html>

</html>
